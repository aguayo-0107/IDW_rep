    <p class="d-inline-flex gap-1">

        </a>
    </p>
    <div class="collapse" id="Adoptar">
        <div class="card card-body">
            <form action="./submit" method="post">
                <label for="persona"> Nombre: </label>

                <br/><br/>

                <br/>

                <br/><br/>
                <button type="submit"> Enviar </button> 
            </form>
        </div>
    </div>
