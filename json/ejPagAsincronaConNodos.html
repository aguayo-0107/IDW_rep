<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio de Página Asíncrona</title>
    </head>
    <body>
        <div id="contenido"></div>

        <script>
            function generaNodoAlumno(alumno) {
                const nodo = document.createElement("a");
                nodo.textContent = alumno.nombre;
                nodo.style.color = "blue";
                console.dir(nodo);
                
                const listaIntereses = document.createElement("ul");
                for (let j = 0; j < alumno.intereses.length; j++) {
                        const nodoInteres = document.createElement("li");
                        nodoInteres.textContent = alumno.intereses[j];
                        listaIntereses.appendChild(nodoInteres);
                }

                return [nodo, listaIntereses];
            } 

            fetch("salon.json")
            .then((respuesta) => {
                // primero imprimimos la respuesta sin procesar
                console.log(respuesta);

                // obetenemos los datos en formato JSON
                return respuesta.json();
            })
            .then((datos) => {
                // imprimimos los datos obtenidos
                console.log(datos);

                // seleccionamos el contenedor donde mostraremos la información
                const contenedor = document.getElementById("contenido");
                contenedor.textContent = JSON.stringify(datos);

                // creamos nodo de JavaScript
                const nodo = document.createElement("p");
                nodo.textContent = datos.profesor.nombre;
                nodo.style.color = "green";
                console.dir(nodo);

                // agregamos el nodo al contenedor
                contenedor.appendChild(nodo);

                // nodo para intereses profesionales
                const elementoDeLista1 = document.createElement("li");
                elementoDeLista1.textContent =
                    datos.profesor.intereses_profesionales[0];

                const elementoDeLista2 = document.createElement("li");
                elementoDeLista2.textContent =
                    datos.profesor.intereses_profesionales[1];

                const elementoDeLista3 = document.createElement("li");
                elementoDeLista3.textContent =
                    datos.profesor.intereses_profesionales[2];

                const lista = document.createElement("ul");
                lista.appendChild(elementoDeLista1);
                lista.appendChild(elementoDeLista2);
                lista.appendChild(elementoDeLista3);

                // agregamos el nodo al contenedor
                contenedor.appendChild(lista);

                //Hasta aqui todo bien
                for (let i = 0; i < datos.alumnos.length; i++) {
                    const [nodoAlumno, listaIntereses] = generaNodoAlumno(datos.alumnos[i]);
                    contenedor.appendChild(nodoAlumno);
                    contenedor.appendChild(listaIntereses);
                }
            })
            .catch((error) => {
                console.error("Ocurrio un error al recoger los datos:", error);
            });
        </script>
    </body>
