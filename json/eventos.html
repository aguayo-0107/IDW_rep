<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Bootstrap</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body >
        <h1>Ejemplo Bootstrap</h1>
        <button onclick="Saludar()">Saludar</button>
        <script>
            function Saludar() {
                alert("¡Hola! Has hecho click en el boton.");
            }
        </script>
        <button onclick="mostrarMensaje()">Mostrar mensaje</button>
        <p id="mensaje"></p>
        <script>
            function mostrarMensaje() {
                const mensajeElemento = document.getElementById("mensaje");
                console.log("Elemento antes de cambiar el texto", JSON.stringify(mensajeElemento.textContent));
                mensajeElemento.textContent = "¡Hola! Has hecho click en el boton.";
                console.log("Elemento después de cambiar el texto", JSON.stringify(mensajeElemento.textContent));
            }
        </script>
        <button onclick="cambiarColor()">Cambiar color</button>
        <script>
            function cambiarColor() {
                const mensajeElemento = document.getElementById("mensaje");
                mensajeElemento.style.color = "blue";            }
        </script>
    </body>
